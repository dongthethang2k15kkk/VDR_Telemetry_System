# ============================================================
# VDR Telemetry - Docker Compose cho SERVER (lab PC)
# Khung MOI: server chi NHAN su kien tu Pi va luu lich su.
# Khong dung chung DB voi Pi. Khong render video (video o Pi).
# Dot nay: mqtt (broker) + subscriber (nhan->ghi DB) + web.
# api se them lai sau khi viet ban doc server_history.db.
# ============================================================
services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: vdr_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    networks:
      - vdr_net

  subscriber:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.subscriber
    container_name: vdr_subscriber
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vdr_data:/data
      - ./secrets:/secrets:ro
    networks:
      - vdr_net
    depends_on:
      - mqtt

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: vdr_web
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - vdr_net

volumes:
  vdr_data:
  mqtt_data:

networks:
  vdr_net:
    driver: bridge
