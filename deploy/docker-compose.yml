# ============================================================
# VDR Telemetry - Docker Compose cho SERVER (lab PC)
# mqtt   : broker (nhan su kien/live tu Pi qua WS)
# server : FastAPI (web/REST/WS) + MQTT nen + nhan upload zip bang chung
# render : worker quet pending zip -> (NAC1: placeholder) -> cap nhat DB
# web    : giao dien
# Server chi luu su kien + video render. obd tho & video goc o Pi.
# ============================================================
services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: vdr_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    networks:
      - vdr_net

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: vdr_server
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - vdr_data:/data
      - ./secrets:/secrets:ro
    networks:
      - vdr_net
    depends_on:
      - mqtt

  render:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.render
    container_name: vdr_render
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - vdr_data:/data
    networks:
      - vdr_net
    depends_on:
      - server

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: vdr_web
    restart: unless-stopped
    ports:
      - "8888:8888"
    networks:
      - vdr_net
    depends_on:
      - server

volumes:
  vdr_data:
  mqtt_data:

networks:
  vdr_net:
    driver: bridge
