# ============================================================
# VDR Telemetry - Docker Compose cho SERVER (VPS lab)
# Chay: docker compose up -d
# Gom 3 service: web (giao dien) + api (REST) + render (lam video bang chung)
# Pi KHONG nam o day - Pi doc CAN/camera roi DAY data len server (qua MQTT/HTTP).
# ============================================================
services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: vdr_api
    restart: unless-stopped
    ports:
      - "8080:8080"          # API REST
    volumes:
      - vdr_data:/data        # DB dung chung (Pi day data vao day)
    environment:
      - DATABASE_PATH=/data/telemetry_v1.db
    networks:
      - vdr_net

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: vdr_web
    restart: unless-stopped
    ports:
      - "8888:8888"          # Giao dien web
    networks:
      - vdr_net
    depends_on:
      - api

  render:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.render
    container_name: vdr_render
    restart: unless-stopped
    volumes:
      - vdr_data:/data        # Doc goi bang chung tho + ghi video da render
    environment:
      - DATABASE_PATH=/data/telemetry_v1.db
    networks:
      - vdr_net
    depends_on:
      - api

volumes:
  vdr_data:                   # Luu tru ben vung (DB + video) - khong mat khi restart

networks:
  vdr_net:
    driver: bridge
